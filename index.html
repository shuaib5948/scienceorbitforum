<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071A2F" />
    <meta
      name="description"
      content="Science Orbit Forum | Where Curiosity Meets Science. A public science forum bringing together students, researchers, educators, innovators and science enthusiasts through programmes, events, research and scientific activities."
    />
    <meta name="keywords" content="science forum, research, innovation, academic events, science programmes, student projects, scientific discussions, science awareness" />
    <meta name="author" content="Science Orbit Forum" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Science Orbit Forum | Where Curiosity Meets Science" />
    <meta property="og:description" content="A public science forum bringing together students, researchers, educators, innovators and science enthusiasts through programmes, events, research and scientific activities." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://scienceorbitforum.org" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Science Orbit Forum | Where Curiosity Meets Science" />
    <meta name="twitter:description" content="A public science forum bringing together students, researchers, educators, innovators and science enthusiasts through programmes, events, research and scientific activities." />
    <meta name="twitter:image" content="/og-image.png" />
    
    <title>Science Orbit Forum · Where Curiosity Meets Science</title>
    <link rel="icon" id="site-favicon" href="/logo-mark.svg" type="image/svg+xml" />
    <script>
      (function() {
        try {
          var host = window.location.hostname.toLowerCase().replace(/^www\./, '');
          var path = window.location.pathname.toLowerCase();
          var isIcrast = host.startsWith('icrast.') || path.startsWith('/icrast') || path === '/venue' || path === '/submit';
          var isFestival = host.startsWith('festival.') || path.startsWith('/festival') || path === '/events/science-festival-2026';
          var fav = document.getElementById('site-favicon');
          
          if (isIcrast) {
            document.title = 'ICRAST-26 · International Conference on Recent Advances in Science & Technology';
            if (fav) { fav.href = '/icrast-favicon.png'; fav.type = 'image/png'; }
          } else if (isFestival) {
            document.title = 'Science Orbit Festival 2K26 (SOF-26) · Science Orbit Forum';
            if (fav) { fav.href = '/festival-favicon.png'; fav.type = 'image/png'; }
          }
        } catch (e) {}
      })();
    </script>
    <link rel="canonical" href="https://scienceorbitforum.org" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=Inter:wght@400..700&family=Sora:wght@400..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
